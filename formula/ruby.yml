summary: The officical ruby interpreter/runtime
git-url: https://github.com/ruby/ruby
web-url: https://www.ruby-lang.org/
src-url: https://cache.ruby-lang.org/pub/ruby/4.0/ruby-4.0.7.tar.gz
src-sha: 911ace20f90d068ca0e4dda6d0e4f0f81e52e52f2dd4f4004c721e253412e82d
license: Ruby
dep-pkg: libyaml libffi libz libopenssl libreadline

prepare: |
    cat > cc-wrapper <<EOF
    #!/bin/sh
    if [ "\$1" = -dynamic ] && [ "\$2" = -bundle ] ; then
        exec "$CC" "\$@" "$PWD/_/libruby.${PACKAGE_VERSION%.*}-static.a" -framework CoreFoundation
    else
        exec "$CC" "\$@"
    fi
    EOF

    chmod +x cc-wrapper
    export CC="$PWD/cc-wrapper"

install: configure --disable-install-doc --disable-install-rdoc --disable-rpath --enable-load-relative --with-static-linked-ext --without-gmp
