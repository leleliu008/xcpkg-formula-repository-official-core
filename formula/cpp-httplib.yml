summary: C++ header-only HTTP/HTTPS server and client library
src-url: https://github.com/yhirose/cpp-httplib/archive/refs/tags/v0.63.0.tar.gz
src-sha: 44ab42e16926e95f7641d286bc90d739ab1c16886114d7cc5bc7a9f905c5edf8
license: MIT
dep-pkg: libz libbrotli libopenssl
install: |
    cmakew \
        -DHTTPLIB_REQUIRE_ZLIB=ON \
        -DHTTPLIB_REQUIRE_BROTLI=ON \
        -DHTTPLIB_REQUIRE_OPENSSL=ON
