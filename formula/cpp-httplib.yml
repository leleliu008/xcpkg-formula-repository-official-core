summary: C++ header-only HTTP/HTTPS server and client library
src-url: https://github.com/yhirose/cpp-httplib/archive/refs/tags/v0.60.0.tar.gz
src-sha: f8d6bc6e2a958f9f21bde11ca408bd987cdf91b99ed9fc63c3e4ea3439376e71
license: MIT
dep-pkg: libz libbrotli libopenssl
install: |
    cmakew \
        -DHTTPLIB_REQUIRE_ZLIB=ON \
        -DHTTPLIB_REQUIRE_BROTLI=ON \
        -DHTTPLIB_REQUIRE_OPENSSL=ON
