summary: C++ header-only HTTP/HTTPS server and client library
src-url: https://github.com/yhirose/cpp-httplib/archive/refs/tags/v0.62.0.tar.gz
src-sha: 7bba5949c56e772236432f69da03197fd4c12dc443455b9d81f6a05575431fc8
license: MIT
dep-pkg: libz libbrotli libopenssl
install: |
    cmakew \
        -DHTTPLIB_REQUIRE_ZLIB=ON \
        -DHTTPLIB_REQUIRE_BROTLI=ON \
        -DHTTPLIB_REQUIRE_OPENSSL=ON
