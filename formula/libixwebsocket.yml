summary: WebSocket client and server, and HTTP client command-line tool
src-url: https://github.com/machinezone/IXWebSocket/archive/refs/tags/v12.1.0.tar.gz
src-sha: 55f3a5d3a1a2c5f19d737c24e6aced28d1200f8f5deb45ecd8e5d46f765b5288
license: BSD-3-Clause
dep-pkg: libopenssl libz

install: |
    cmakew 2 \
        -DUSE_TLS=ON \
        -DUSE_OPEN_SSL=ON \
        -DUSE_NETWORK_FRAMEWORK=OFF \
        -DUSE_ZLIB=ON \
        -DUSE_WS=OFF \
        -DBUILD_DEMO=OFF \
        -DIXWEBSOCKET_INSTALL=ON
