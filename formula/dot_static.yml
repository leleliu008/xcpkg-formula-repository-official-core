summary: A command-line tool for drawing graphs
web-url: https://www.graphviz.org/
src-url: https://gitlab.com/graphviz/graphviz/-/archive/15.1.1/graphviz-15.1.1.tar.bz2
src-sha: 748a9a2ebdb6c1748e64249d2cb3a1700f056713d8a28f7c8c66dea417f3a4a7
license: EPL-1.0
dep-pkg: libgd libpango
dep-upp: gm4 flex bison gawk git python3 libtool
bsystem: autogen

install: |
    configure only \
        --disable-swig \
        --disable-php \
        --disable-tcl \
        --without-gdk \
        --without-gtk \
        --without-qt \
        --without-x
    gmakew
    install_bins cmd/dot/.libs/dot_static
