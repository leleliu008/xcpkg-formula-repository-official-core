summary: C library to convert SVG to PNG
web-url: https://github.com/RazrFalcon/resvg
src-url: https://github.com/linebender/resvg/archive/refs/tags/v0.49.0.tar.gz
src-sha: 3077d547f755d3ca4ab9144a8fb9ec6d366415157bf8d26727f0b5dcdd22742f
license: MPL-2.0
install: |
    cargow build --locked --lib --manifest-path crates/c-api/Cargo.toml
    install_incs crates/c-api/resvg.h crates/c-api/ResvgQt.h
    install_libs target/$RUST_TARGET/$PROFILE/libresvg.a
    install_libs target/$RUST_TARGET/$PROFILE/libresvg.dylib
