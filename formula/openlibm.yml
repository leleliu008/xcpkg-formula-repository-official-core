pkgtype: lib
summary: High quality, portable, open source libm implementation
web-url: https://openlibm.org
src-url: https://github.com/JuliaMath/openlibm/archive/refs/tags/v0.8.8.tar.gz
src-sha: 721bab18ff37160fd9e903eb211ff26fdee38c3d0041d556b07d76089c435d17
license: MIT ISC BSD-2-Clause

install: |
    gmakew clean
    gmakew install \
        prefix="$PACKAGE_INSTALL_DIR" \
        CC="$CC" \
        CFLAGS="'$CFLAGS'" \
        CPPFLAGS="'$CPPFLAGS'" \
        LDFLAGS="'$LDFLAGS'" \
        AR="$AR" \
        OS=Darwin \
        ARCH="$TARGET_PLATFORM_ARCH"
