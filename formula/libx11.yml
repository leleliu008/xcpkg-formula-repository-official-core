summary: X.Org protocol client library
src-url: https://xorg.freedesktop.org/archive/individual/lib/libX11-1.8.14.tar.gz
src-sha: ebb8a58549ddde50aa2e742b3b256557f451053d173be8dbfc2e8ac078eee1d6
license: MIT
dep-pkg: libxcb xtrans

prepare: |
    unset  LC_ALL
    export LC_CTYPE=C

install: |
    configure \
        --enable-ipv6 \
        --enable-tcp-transport \
        --enable-unix-transport \
        --enable-loadable-i18n \
        --enable-xthreads \
        --enable-specs=no
