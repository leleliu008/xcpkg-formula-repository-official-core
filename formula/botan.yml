summary: Cryptographic algorithms and formats library in C++
git-url: https://github.com/randombit/botan
src-url: https://botan.randombit.net/releases/Botan-3.14.1.tar.xz
src-sha: 5b85cba0f014d344eb8e9919aee0a3bdc31e16acb05816410025be9bee1e0930
license: BSD-2-Clause
dep-pkg: python3 libsqlite3 libbz2 libz
bsystem: gmake

install: |
    export CXXFLAGS="$CXXFLAGS $CPPFLAGS"
    python3 configure.py \
        --prefix=$PACKAGE_INSTALL_DIR \
        --docdir=share/doc \
        --cc=gcc \
        --with-zlib \
        --with-bzip2 \
        --with-sqlite3
    gmakew install
