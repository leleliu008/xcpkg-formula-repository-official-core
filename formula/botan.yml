summary: Cryptographic algorithms and formats library in C++
git-url: https://github.com/randombit/botan
src-url: https://botan.randombit.net/releases/Botan-3.14.0.tar.xz
src-sha: c22d66a08cd3c6dae683bdcb8384beaa9e2cbd75821e19a270047030fbe81ac7
license: BSD-2-Clause
dep-pkg: python3 libsqlite3 libbz2 libz
bsystem: gmake

install: |
    export CXXFLAGS="$CXXFLAGS $CPPFLAGS"
    python3 configure.py \
        --prefix=$PACKAGE_INSTALL_DIR \
        --docdir=share/doc \
        --cc=gcc \
        --with-zlib \
        --with-bzip2 \
        --with-sqlite3
    gmakew install
