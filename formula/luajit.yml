summary: Just-In-Time Compiler (JIT) for the Lua programming language
web-url: https://luajit.org/
src-url: https://github.com/LuaJIT/LuaJIT/archive/95f931cb1ee7ab14f249d61fb3734803429025f8.tar.gz
src-sha: 284b59730849d399dfd6137c3d492e3d21ee6e32ee0f00d2dce7898ab54b270e
version: 2.1.1792527110
license: MIT

prepare: export MACOSX_DEPLOYMENT_TARGET="$TARGET_PLATFORM_VERS"

install: |
    gmakew clean amalg install \
        PREFIX="$PACKAGE_INSTALL_DIR" \
        CC="$CC" \
        LD="$CC" \
        CFLAGS="'$CFLAGS'" \
        LDFLAGS="'$LDFLAGS'" \
        HOST_CC="'$CC_FOR_BUILD'" \
        HOST_LD="$CC_FOR_BUILD" \
        TARGET_CC="$CC" \
        TARGET_LD="$CC" \
        TARGET_AR="'$AR rcus'" \
        TARGET_STRIP=true \
        TARGET_SYS=Darwin \
        HOST_SYS=Darwin \
        Q=
