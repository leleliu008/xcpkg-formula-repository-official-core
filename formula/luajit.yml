summary: Just-In-Time Compiler (JIT) for the Lua programming language
web-url: https://luajit.org/
src-url: https://github.com/LuaJIT/LuaJIT/archive/63c8f1a9b479ba5518cf6a170ff7729178bc3cfd.tar.gz
src-sha: 8cad76f444b76001b7123dc626c5d0bfc24f1f790333737443345f7e6b41bb5f
version: 2.1.1794386141
license: MIT

prepare: export MACOSX_DEPLOYMENT_TARGET="$TARGET_PLATFORM_VERS"

install: |
    gmakew clean amalg install \
        PREFIX="$PACKAGE_INSTALL_DIR" \
        CC="$CC" \
        LD="$CC" \
        CFLAGS="'$CFLAGS'" \
        LDFLAGS="'$LDFLAGS'" \
        HOST_CC="'$CC_FOR_BUILD'" \
        HOST_LD="$CC_FOR_BUILD" \
        TARGET_CC="$CC" \
        TARGET_LD="$CC" \
        TARGET_AR="'$AR rcus'" \
        TARGET_STRIP=true \
        TARGET_SYS=Darwin \
        HOST_SYS=Darwin \
        Q=
