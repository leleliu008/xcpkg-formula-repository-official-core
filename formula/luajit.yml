summary: Just-In-Time Compiler (JIT) for the Lua programming language
web-url: https://luajit.org/
src-url: https://github.com/LuaJIT/LuaJIT/archive/c4b1e2f73a2e10fbcc637fcec474f639c38daafe.tar.gz
src-sha: 8232ea0ebc837a56ef679f8e4c04c2dfc4dec0b4145282337fd618b270b43ddd
version: 2.1.1794214635
license: MIT

prepare: export MACOSX_DEPLOYMENT_TARGET="$TARGET_PLATFORM_VERS"

install: |
    gmakew clean amalg install \
        PREFIX="$PACKAGE_INSTALL_DIR" \
        CC="$CC" \
        LD="$CC" \
        CFLAGS="'$CFLAGS'" \
        LDFLAGS="'$LDFLAGS'" \
        HOST_CC="'$CC_FOR_BUILD'" \
        HOST_LD="$CC_FOR_BUILD" \
        TARGET_CC="$CC" \
        TARGET_LD="$CC" \
        TARGET_AR="'$AR rcus'" \
        TARGET_STRIP=true \
        TARGET_SYS=Darwin \
        HOST_SYS=Darwin \
        Q=
