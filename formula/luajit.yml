summary: Just-In-Time Compiler (JIT) for the Lua programming language
web-url: https://luajit.org/
src-url: https://github.com/LuaJIT/LuaJIT/archive/a4c064539ea931274d407e1249b4bb575424a0f4.tar.gz
src-sha: 15625df3ebfbd1f76371005bffae39b84c65e718e57acc9a9c57863c7c101541
version: 2.1.1792588164
license: MIT

prepare: export MACOSX_DEPLOYMENT_TARGET="$TARGET_PLATFORM_VERS"

install: |
    gmakew clean amalg install \
        PREFIX="$PACKAGE_INSTALL_DIR" \
        CC="$CC" \
        LD="$CC" \
        CFLAGS="'$CFLAGS'" \
        LDFLAGS="'$LDFLAGS'" \
        HOST_CC="'$CC_FOR_BUILD'" \
        HOST_LD="$CC_FOR_BUILD" \
        TARGET_CC="$CC" \
        TARGET_LD="$CC" \
        TARGET_AR="'$AR rcus'" \
        TARGET_STRIP=true \
        TARGET_SYS=Darwin \
        HOST_SYS=Darwin \
        Q=
