summary: A free and easy-to-use client-side URL transfer library
git-url: https://github.com/curl/curl
src-url: https://curl.se/download/curl-8.23.0.tar.bz2
src-sha: 95b22eb32bf6d1fa6e3e9463bdb61cece3efc56d86576a9b3cbd428246a6d854
license: curl
dep-pkg: libnghttp2 libbrotli libzstd libz libopenssl
dep-upp: perl

dopatch: gsed -i '/^SUBDIRS = /s| src||' Makefile.in

install: |
    configure \
        --enable-optimize \
        --enable-pthreads \
        --with-default-ssl-backend=openssl \
        --with-ssl="$libopenssl_INSTALL_DIR" \
        --with-nghttp2 \
        --without-nghttp3 \
        --without-ngtcp2 \
        --without-quiche \
        --without-libpsl \
        --without-librtmp \
        --without-libidn2

dotweak: |
    gsed -i -e '/Libs.private:/d' -e '/^Libs:/s|$| -lldap -framework CoreFoundation -framework SystemConfiguration|' lib/pkgconfig/libcurl.pc
