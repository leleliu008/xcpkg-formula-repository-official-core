summary: Vi IMproved - enhanced vi editor
web-url: https://www.vim.org/
src-url: https://github.com/vim/vim/archive/refs/tags/v9.2.1342.tar.gz
src-sha: 321d6b7832b9c6def7fb7f533d28266a4a4f80e46506cedeea177e26096b2957
license: Vim
dep-pkg: libncurses libintl python3 liblua
binbstd: 1

install: |
    configure \
        --without-x \
        --with-lua-prefix="$liblua_INSTALL_DIR" \
        --with-tlib=ncursesw \
        --with-compiledby=xcpkg \
        --with-features=huge \
        --enable-cscope \
        --enable-terminal \
        --enable-multibyte \
        --enable-perlinterp=no \
        --enable-rubyinterp=no \
        --enable-python3interp \
        --enable-luainterp \
        --enable-gui=no
