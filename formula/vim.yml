summary: Vi IMproved - enhanced vi editor
web-url: https://www.vim.org/
src-url: https://github.com/vim/vim/archive/refs/tags/v9.2.1351.tar.gz
src-sha: f5e1c90b7d64ae3349015c514bbad89df3c92dc5115513b5b71269e7c36437da
license: Vim
dep-pkg: libncurses libintl python3 liblua
binbstd: 1

install: |
    configure \
        --without-x \
        --with-lua-prefix="$liblua_INSTALL_DIR" \
        --with-tlib=ncursesw \
        --with-compiledby=xcpkg \
        --with-features=huge \
        --enable-cscope \
        --enable-terminal \
        --enable-multibyte \
        --enable-perlinterp=no \
        --enable-rubyinterp=no \
        --enable-python3interp \
        --enable-luainterp \
        --enable-gui=no
