summary: Vi IMproved - enhanced vi editor
web-url: https://www.vim.org/
src-url: https://github.com/vim/vim/archive/refs/tags/v9.2.1373.tar.gz
src-sha: 1530e7f53811c5c1000410b6f9831d15a3f1e258d6dc4fbd7ab3dca344fb541f
license: Vim
dep-pkg: libncurses libintl python3 liblua
binbstd: 1

install: |
    configure \
        --without-x \
        --with-lua-prefix="$liblua_INSTALL_DIR" \
        --with-tlib=ncursesw \
        --with-compiledby=xcpkg \
        --with-features=huge \
        --enable-cscope \
        --enable-terminal \
        --enable-multibyte \
        --enable-perlinterp=no \
        --enable-rubyinterp=no \
        --enable-python3interp \
        --enable-luainterp \
        --enable-gui=no
