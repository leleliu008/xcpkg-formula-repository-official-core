summary: Open source programming language to build simple/reliable/efficient software
git-url: https://github.com/golang/go
web-url: https://go.dev/
src-url: https://go.dev/dl/go1.27.3.src.tar.gz
src-sha: 6e7749035cf360f06b2575d162ea79df9fda8ef671889e5c375f8e50777f26bb
license: BSD-3-Clause
version: 1.27.3
dep-upp: bash
bscript: src
bsystem: go

install: |
    export GOROOT_BOOTSTRAP="$(go env GOROOT)"

    run ./make.bash
    run cd ..
    run rm -rf _
    run rm -rf pkg/obj
    run cd ..
    run install -d "$PACKAGE_INSTALL_DIR"
    run mv src/*   "$PACKAGE_INSTALL_DIR"
