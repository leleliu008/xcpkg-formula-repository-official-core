summary: Open source programming language to build simple/reliable/efficient software
git-url: https://github.com/golang/go
web-url: https://go.dev/
src-url: https://go.dev/dl/go1.27.2.src.tar.gz
src-sha: 03495da2ba64894d40f5c4992e49454fa78b50690604ff92b6afff5081b76e62
license: BSD-3-Clause
version: 1.25.6
dep-upp: bash
bscript: src
bsystem: go

install: |
    export GOROOT_BOOTSTRAP="$(go env GOROOT)"

    run ./make.bash
    run cd ..
    run rm -rf _
    run rm -rf pkg/obj
    run cd ..
    run install -d "$PACKAGE_INSTALL_DIR"
    run mv src/*   "$PACKAGE_INSTALL_DIR"
