summary: Open source programming language to build simple/reliable/efficient software
git-url: https://github.com/golang/go
src-url: https://go.dev/dl/go1.27.4.src.tar.gz
src-sha: 73cfb8571aec0c01177687db87163d46aa20e9779672772891aa17654d9a6099
license: BSD-3-Clause
version: 1.27.4
dep-upp: bash
bscript: src
bsystem: go

install: |
    export GOROOT_BOOTSTRAP="$(go env GOROOT)"

    run ./make.bash
    run cd ..
    run rm -rf _
    run rm -rf pkg/obj
    run cd ..
    run install -d "$PACKAGE_INSTALL_DIR"
    run mv src/*   "$PACKAGE_INSTALL_DIR"
