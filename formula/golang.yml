summary: Open source programming language to build simple/reliable/efficient software
git-url: https://github.com/golang/go
web-url: https://go.dev/
src-url: https://go.dev/dl/go1.27.1.src.tar.gz
src-sha: 4e408abae126d916b6164627193f2c54f0e3ca1312d693b86db45f862ab238b1
license: BSD-3-Clause
version: 1.25.6
dep-upp: bash
bscript: src
bsystem: go

install: |
    export GOROOT_BOOTSTRAP="$(go env GOROOT)"

    run ./make.bash
    run cd ..
    run rm -rf _
    run rm -rf pkg/obj
    run cd ..
    run install -d "$PACKAGE_INSTALL_DIR"
    run mv src/*   "$PACKAGE_INSTALL_DIR"
