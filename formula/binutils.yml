summary: GNU binary tools for native development
git-url: https://sourceware.org/git/binutils-gdb
src-url: https://ftp.gnu.org/gnu/binutils/binutils-2.47.tar.bz2
src-sha: 3068128c75cda9f898ccb4211d360246e8e195ffcc9dfb655b23ae23a54800e8
license: GPL-2.0-or-later
dep-pkg: libz libzstd
dep-upp: gm4 bison texinfo

dopatch: gsed -i 's|$(LIBCTF_NOBFD)|$(LIBCTF_NOBFD) $(LIBCTF)|' binutils/Makefile.in

install: |
    configure \
        --with-zstd \
        --with-system-zlib \
        --disable-gprofng \
        --disable-werror \
        --disable-nls \
        --disable-shared \
        --enable-static \
        --enable-gold \
        --enable-64-bit-bfd \
        --enable-plugins \
        --enable-interwork \
        --enable-multilib \
        --enable-targets=all
