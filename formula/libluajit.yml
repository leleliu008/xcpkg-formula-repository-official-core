summary: Just-In-Time Compiler (JIT) for the Lua programming language
web-url: https://luajit.org/
src-url: https://github.com/LuaJIT/LuaJIT/archive/ea9eb7edb5eac4a9d175d74523db34fac0fa5180.tar.gz
src-sha: 338a5640be00b89fd0a2a027a7433fcbbb4d006be840d216d84151386b5bcdf7
version: 2.1.1793383622
license: MIT

dopatch: |
    gsed -i '/^INSTALL_DEP= /c INSTALL_DEP= src/libluajit.a src/libluajit.dylib' Makefile
    gsed -i '/cd src\/jit/d' Makefile

prepare: export MACOSX_DEPLOYMENT_TARGET="$TARGET_PLATFORM_VERS"

install: |
    gmakew -C src clean libluajit.a libluajit.so \
        CC="$CC" \
        LD="$CC" \
        CFLAGS="'$CFLAGS'" \
        LDFLAGS="'$LDFLAGS'" \
        HOST_CC="'$CC_FOR_BUILD'" \
        HOST_LD="$CC_FOR_BUILD" \
        TARGET_CC="$CC" \
        TARGET_LD="$CC" \
        TARGET_AR="'$AR rcus'" \
        TARGET_STRIP=true \
        TARGET_SYS=Darwin \
        Q=
    touch src/luajit
    gmakew install PREFIX="$PACKAGE_INSTALL_DIR"

dotweak: rm -rf bin/ share/
