summary: A command-line tool for downloading RTMP streaming media
web-url: https://rtmpdump.mplayerhq.hu
git-url: https://git.ffmpeg.org/rtmpdump
git-tag: v2.6
license: GPL-2.0-or-later
dep-pkg: libz libopenssl
parallel: 0

install: |
    gmakew clean   SYS=darwin
    gmakew         SYS=darwin CC="$CC" LD="$LD" LIB_RTMP=librtmp/librtmp.a OPT= XCFLAGS="'$CFLAGS $CPPFLAGS'" XLDFLAGS="'$LDFLAGS'"
    gmakew install SYS=darwin prefix="$PACKAGE_INSTALL_DIR"
