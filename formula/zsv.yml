summary: A command-line utility for parsing CSV
src-url: https://github.com/liquidaty/zsv/archive/refs/tags/v1.4.3.tar.gz
src-sha: 8372ec277b0cf56d02e3407e355208875fdfa174a3ed01e6ffb9a00fe440fc43
dep-pkg: libncurses libpcre2 libjq
dep-upp: perl
ldflags: -lonig

install: |
    export CFLAGS="$CFLAGS $CPPFLAGS -I$PWD/include"

    run ./configure \
        --disable-termcap \
        --prefix="$PACKAGE_INSTALL_DIR" \
        --jq-prefix="$libjq_INSTALL_DIR" \
        --pcre2-8-prefix="$libpcre2_INSTALL_DIR"

    gmakew -C src build
    gmakew -C app build
    gmakew -C app install
