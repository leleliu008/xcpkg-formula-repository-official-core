summary: A command-line utility for parsing CSV
src-url: https://github.com/liquidaty/zsv/archive/refs/tags/v1.4.4.tar.gz
src-sha: 99486b6901d6b576bf15afceb0bcc888ceeb3f555a6d489547eefe67eff52079
dep-pkg: libncurses libpcre2 libjq
dep-upp: perl
ldflags: -lonig

install: |
    export CFLAGS="$CFLAGS $CPPFLAGS -I$PWD/include"

    run ./configure \
        --disable-termcap \
        --prefix="$PACKAGE_INSTALL_DIR" \
        --jq-prefix="$libjq_INSTALL_DIR" \
        --pcre2-8-prefix="$libpcre2_INSTALL_DIR"

    gmakew -C src build
    gmakew -C app build
    gmakew -C app install
