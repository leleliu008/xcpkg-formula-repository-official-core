summary: BSD tar
git-url: https://github.com/libarchive/libarchive
src-url: https://www.libarchive.org/downloads/libarchive-3.8.11.tar.xz
src-sha: a3dc0872b1b39da34dc18ef1b944f0f11ffd37425d70ae04be679279f1cf43d2
license: BSD-2-Clause
dep-pkg: liblz4 liblzo libzstd liblzma libbz2 libz libexpat libopenssl

install: |
    configure \
        --enable-acl \
        --enable-xattr \
        --enable-bsdtar \
        --enable-bsdcat \
        --enable-bsdcpio \
        --enable-bsdunzip \
        --enable-static \
        --disable-shared \
        --without-mbedtls \
        --without-nettle \
        --without-libb2 \
        --without-xml2 \
        --without-cng \
        --with-openssl \
        --with-expat \
        --with-zlib \
        --with-lzma \
        --with-bz2lib \
        --with-lz4 \
        --with-lzo2 \
        --with-zstd \
        --without-iconv

dotweak: rm -rf lib/ include/ share/man/man[35]
