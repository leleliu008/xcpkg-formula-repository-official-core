summary: BSD tar
git-url: https://github.com/libarchive/libarchive
web-url: https://www.libarchive.org/
src-url: https://www.libarchive.org/downloads/libarchive-3.8.9.tar.xz
src-sha: 888c934f9d95648ecb9163dc8e23ab80a476ecb81a8f1154704a227b5b676dde
license: BSD-2-Clause
dep-pkg: liblz4 liblzo libzstd liblzma libbz2 libz libexpat libopenssl

install: |
    configure \
        --enable-acl \
        --enable-xattr \
        --enable-bsdtar \
        --enable-bsdcat \
        --enable-bsdcpio \
        --enable-bsdunzip \
        --enable-static \
        --disable-shared \
        --without-mbedtls \
        --without-nettle \
        --without-libb2 \
        --without-xml2 \
        --without-cng \
        --with-openssl \
        --with-expat \
        --with-zlib \
        --with-lzma \
        --with-bz2lib \
        --with-lz4 \
        --with-lzo2 \
        --with-zstd \
        --without-iconv

dotweak: rm -rf lib/ include/ share/man/man[35]
