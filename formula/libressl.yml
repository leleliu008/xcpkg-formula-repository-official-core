summary: Version of the SSL/TLS protocol forked from OpenSSL
web-url: https://www.libressl.org/
git-url: https://github.com/libressl/portable
src-url: https://ftp.openbsd.org/pub/OpenBSD/LibreSSL/libressl-4.4.0.tar.gz
src-sha: 7d02522ad5070b9adb32eb253ecabce181184a3750cf65abac0675ee908687c1
license: OpenSSL

install: |
    cmakew \
        -DLIBRESSL_APPS=OFF \
        -DLIBRESSL_TESTS=OFF \
        -DENABLE_EXTRATESTS=OFF \
        -DENABLE_ASM=ON \
        -DENABLE_NC=OFF
