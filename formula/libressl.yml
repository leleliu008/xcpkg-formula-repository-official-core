summary: Version of the SSL/TLS protocol forked from OpenSSL
web-url: https://www.libressl.org/
git-url: https://github.com/libressl/portable
src-url: https://ftp.openbsd.org/pub/OpenBSD/LibreSSL/libressl-4.4.1.tar.gz
src-sha: 290cdf1b53c086255dc302f118b98602a444e9ae6d11e9bfdd8c9b1b60aa3a22
license: OpenSSL

install: |
    cmakew \
        -DLIBRESSL_APPS=OFF \
        -DLIBRESSL_TESTS=OFF \
        -DENABLE_EXTRATESTS=OFF \
        -DENABLE_ASM=ON \
        -DENABLE_NC=OFF
