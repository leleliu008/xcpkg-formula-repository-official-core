summary: ISO9660+RR manipulation tool
src-url: https://ftp.gnu.org/gnu/xorriso/xorriso-1.5.8.pl02.tar.gz
src-sha: b1455ecafbf0692ddafe1d71002a96f2ce2d77f4deae602678261ce033f97bc8
license: GPL-2.0-or-later
dep-pkg: libiconv
dep-upp: patch
dopatch: |
    # https://lists.gnu.org/archive/html/bug-xorriso/2023-06/msg00000.html
    patch -p1 <<EOF
    diff --git a/libisofs/rockridge.h b/libisofs/rockridge.h
    index 5649eb7..01c4224 100644
    --- a/libisofs/rockridge.h
    +++ b/libisofs/rockridge.h
    @@ -41,6 +41,8 @@

     #include "ecma119.h"

    +/* For ssize_t */
    +#include <unistd.h>

     #define SUSP_SIG(entry, a, b) ((entry->sig[0] == a) && (entry->sig[1] == b))
    EOF

install: |
    configure \
        --enable-libacl \
        --enable-xattr \
        --enable-zlib \
        --enable-libbz2 \
        --enable-libcdio \
        --enable-jtethreads
