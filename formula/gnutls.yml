pkgtype: lib
summary: GNU Transport Layer Security (TLS) Library
web-url: https://gnutls.org
git-url: https://github.com/gnutls/gnutls
src-url: https://www.gnupg.org/ftp/gcrypt/gnutls/v3.8/gnutls-3.8.14.tar.xz
src-sha: 7e2d258071f5db9620aa7ff34259331d004f7beafa3eb18560cfaf60acfbf02a
dep-pkg: libgmp libunistring libnettle libtasn1 libidn2

install: |
    configure \
        --without-gcov \
        --without-p11-kit \
        --disable-valgrind-tests \
        --disable-code-coverage \
        --disable-gtk-doc \
        --disable-guile \
        --disable-tests \
        --enable-gcc-warnings
