pkgtype: lib
summary: GNU Transport Layer Security (TLS) Library
web-url: https://gnutls.org
git-url: https://github.com/gnutls/gnutls
src-url: https://www.gnupg.org/ftp/gcrypt/gnutls/v3.8/gnutls-3.8.13.tar.xz
src-sha: ffed8ec1bf09c2426d4f14aae377de4753b53e537d685e604e99a8b16ca9c97e
dep-pkg: libgmp libunistring libnettle libtasn1 libidn2

install: |
    configure \
        --without-gcov \
        --without-p11-kit \
        --disable-valgrind-tests \
        --disable-code-coverage \
        --disable-gtk-doc \
        --disable-guile \
        --disable-tests \
        --enable-gcc-warnings
