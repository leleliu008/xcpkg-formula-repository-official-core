summary: A meta-build system for generating build files for ninja
web-url: https://gn.googlesource.com/gn
git-url: https://github.com/cglogic/gn
git-nth: 0
version: 2345
dep-upp: python3

prepare: |
    run git checkout v$PACKAGE_VERSION
    run python3 build/gen.py --platform=darwin --out-path=_

install: run ninja && install_bins gn
