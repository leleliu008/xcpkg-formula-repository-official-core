summary: Multi-format archive and compression library
git-url: https://github.com/libarchive/libarchive
src-url: https://www.libarchive.org/downloads/libarchive-3.8.11.tar.xz
src-sha: a3dc0872b1b39da34dc18ef1b944f0f11ffd37425d70ae04be679279f1cf43d2
license: BSD-2-Clause
dep-pkg: liblz4 liblzo libzstd liblzma libbz2 libz libiconv libexpat libopenssl

install: |
    configure \
        --enable-acl \
        --enable-xattr \
        --disable-bsdtar \
        --disable-bsdcat \
        --disable-bsdcpio \
        --disable-bsdunzip \
        --without-mbedtls \
        --without-nettle \
        --without-libb2 \
        --without-xml2 \
        --without-cng \
        --with-openssl \
        --with-expat \
        --with-zlib \
        --with-lzma \
        --with-bz2lib \
        --with-lz4 \
        --with-lzo2 \
        --with-zstd \
        --with-iconv

dotweak: gsed -i -e 's| -lcrypto .*||' -e '/^Requires/s|iconv|libiconv expat libzstd liblzma liblz4 libbz2 libz lzo2|' lib/pkgconfig/libarchive.pc
