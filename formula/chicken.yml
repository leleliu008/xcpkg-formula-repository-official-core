summary: Compiler for the Scheme programming language
web-url: https://www.call-cc.org/
git-url: https://code.call-cc.org/git/chicken-core.git
src-url: https://code.call-cc.org/releases/6.0.0/chicken-6.0.0.tar.gz
src-sha: 92835552b1b687ad26737e429b5aba36510bf429f8816ec0f6d336c8cb41f443
license: BSD-3-Clause

parallel: 0

install: |
    gmakew clean PLATFORM=macosx
    gmakew         PREFIX=$PACKAGE_INSTALL_DIR C_COMPILER=$CC C_COMPILER_OPTIONS="'$CFLAGS $CPPFLAGS -DHAVE_CHICKEN_CONFIG_H'" LIBRARIAN=$AR LINKER_OPTIONS="'$LDFLAGS'" PLATFORM=macosx ARCH="$TARGET_PLATFORM_ARCH" POSTINSTALL_PROGRAM=true
    gmakew install PREFIX=$PACKAGE_INSTALL_DIR C_COMPILER=$CC C_COMPILER_OPTIONS="'$CFLAGS $CPPFLAGS -DHAVE_CHICKEN_CONFIG_H'" LIBRARIAN=$AR LINKER_OPTIONS="'$LDFLAGS'" PLATFORM=macosx ARCH="$TARGET_PLATFORM_ARCH" POSTINSTALL_PROGRAM=true
