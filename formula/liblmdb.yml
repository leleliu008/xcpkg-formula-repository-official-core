summary: An extraordinarily fast, memory-efficient, memory-mapped, key-value database
web-url: https://symas.com/lmdb
src-url: https://distfiles.macports.org/lmdb/openldap-1.0.3.tar.bz2
src-sha: 75828a5de644d80d95b18d0ddf4a089f50ea666803cc1ed1a758c96b7e1a1c01
license: OLDAP-2.8

bscript: libraries/liblmdb

dopatch: gsed -i '/ln -s /d' Makefile

install: |
    gmakew clean
    gmakew liblmdb.a liblmdb.dylib CC=$CC CFLAGS="'$CFLAGS'" LDFLAGS="'$LDFLAGS'" AR="$AR" SOFULL=.dylib VERSION_OPT=
    install_incs lmdb.h
    install_libs liblmdb.a liblmdb.dylib
