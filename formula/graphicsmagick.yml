pkgtype: lib
summary: Image processing tools collection
web-url: http://www.graphicsmagick.org/
src-url: https://downloads.sourceforge.net/project/graphicsmagick/graphicsmagick/1.3.48/GraphicsMagick-1.3.48.tar.xz
src-sha: 9218eb78179110f91371066ab75cb3b4dd034b9bb464b29ce9bab7a11979232b
license: MIT
dep-pkg: libltdl libfreetype libjasper libjxl libxml2
dep-upp: libtool

install: |
    configure \
        --disable-openmp \
        --disable-static \
        --enable-shared \
        --with-modules \
        --with-quantum-depth=16 \
        --without-lzma \
        --without-x \
        --without-gslib \
        --without-wmf \
        --with-jxl
