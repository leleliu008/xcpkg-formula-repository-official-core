summary: Platform-neutral API for system-level and libc-like functions
web-url: https://developer.mozilla.org/docs/Mozilla/Projects/NSPR
src-url: https://archive.mozilla.org/pub/nspr/releases/v4.40/src/nspr-4.40.tar.gz
src-sha: c0c1884c627f3db7a783f7c7314c695226b2043696791d15519e7e0578c19bdc
license: MPL-2.0
bscript: nspr

dopatch: gsed -i 's|@executable_path|@rpath|g' configure

install: |
    configure \
        --enable-macos-target="$TARGET_PLATFORM_VERS" \
        --enable-64bit \
        --enable-strip \
        --enable-ipv6 \
        --disable-cplus \
        --with-pthreads \
        HOST_CC='/usr/bin/cc' \
        HOST_CXX='/usr/bin/c++' \
        HOST_CFLAGS='-O0' \
        HOST_CXXFLAGS='-O0' \
        HOST_LDFLAGS=''
