summary: Media player based on MPlayer and mplayer2
web-url: https://mpv.io
src-url: https://github.com/mpv-player/mpv/archive/refs/tags/v0.42.0.tar.gz
src-sha: bcfebbfa2b65a6d88dc97ea18117831072373e38b5785a2afb874ed4df5070dd
dep-pkg: libplacebo libbluray libluajit libmujs libass libuchardet librubberband ffmpeg

dopatch: |
    gsed -i "/iconv =/c iconv = dependency('libiconv', method : 'pkg-config')" meson.build

install: |
    mesonw \
        -Dtests=false \
        -Dlibmpv=true \
        -Dcplayer=false \
        -Dvulkan=enabled \
        -Duchardet=enabled \
        -Dlibbluray=enabled \
        -Dlibarchive=enabled \
        -Djavascript=enabled \
        -Dvapoursynth=disabled \
        -Dlua=luajit
