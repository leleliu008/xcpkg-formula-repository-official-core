summary: A package manager for the Zig programming language
web-url: https://nektro.github.io/zigmod/
src-url: https://github.com/nektro/zigmod/archive/refs/tags/r107.tar.gz
src-sha: 605717096ebe830591aad10a1dd590bbb0dc2d2ea76fd37840adaeee08fba5d9
license: MIT
dep-upp: git
bsystem: zig@0.17

prepare: |
    case $PROFILE in
        debug)   ZIG_BUILD_EXTRA_ARGS='-Dstrip=false' ;;
        release) ZIG_BUILD_EXTRA_ARGS='-Dstrip=true'  ;;
    esac

install: zig -Dtag=r$PACKAGE_VERSION $ZIG_BUILD_EXTRA_ARGS
