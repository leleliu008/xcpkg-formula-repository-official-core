summary: A package manager for the Zig programming language
web-url: https://nektro.github.io/zigmod/
src-url: https://github.com/nektro/zigmod/archive/refs/tags/r105.tar.gz
src-sha: b88a477602b63ce4f013701369ab4356ff91830915021443aa74380df474c1b3
license: MIT
dep-upp: git
bsystem: zig@0.16

prepare: |
    case $PROFILE in
        debug)   ZIG_BUILD_EXTRA_ARGS='-Dmode=Debug       -Dstrip=false' ;;
        release) ZIG_BUILD_EXTRA_ARGS='-Dmode=ReleaseSafe -Dstrip=true'  ;;
    esac

install: zig -Dtag=r$PACKAGE_VERSION $ZIG_BUILD_EXTRA_ARGS
