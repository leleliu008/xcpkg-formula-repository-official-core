summary: A package of several programs related to finding files
src-url: https://ftp.gnu.org/gnu/findutils/findutils-4.11.0.tar.xz
src-sha: bfd19cb06cc71f3352d567e90284d8cdac02ac89774bbeadf0b533b0c11432fd
license: GPL-3.0-or-later

install: |
    configure \
        --without-selinux \
        --with-included-regex \
        --enable-threads=posix \
        --enable-leaf-optimisation \
        --enable-d_type-optimisation \
        --disable-assert
