summary: A perl module for parsing XML documents
git-url: https://github.com/cpan-authors/XML-Parser
src-url: https://cpan.metacpan.org/authors/id/T/TO/TODDR/XML-Parser-2.59.tar.gz
src-sha: a358fd7c49f5e27717a644a9102bd21dc7fc25a415983279c59b1580e2b62a58
dep-pkg: libexpat
dep-plm: File::ShareDir::Install

install: |
    export EXPATLIBPATH="$libexpat_LIBRARY_DIR"
    export EXPATINCPATH="$libexpat_INCLUDE_DIR"
    run perl Makefile.PL "INSTALL_BASE=$PACKAGE_INSTALL_DIR"
    gmakew install
    __check_mach_o_files() {
        :
    }
