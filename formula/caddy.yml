summary: A powerful, enterprise-ready, open source web server with automatic HTTPS
web-url: https://caddyserver.com/

src-url: https://github.com/caddyserver/caddy/archive/refs/tags/v2.11.7.tar.gz
src-sha: 86e39de5fa0bc433a9cd574a00e7751059903401f3389c61f8937fd0ad0180f5

res-url: https://github.com/caddyserver/xcaddy/archive/refs/tags/v0.4.5.tar.gz
res-sha: 53c6a9e29965aaf19210ac6470935537040e782101057a199098feb33c2674f8

license: Apache-2.0
dep-upp: golang
binbstd: 1

do12345: |
    run cd ../res
    run go build -v ./cmd/xcaddy
    run mv xcaddy ../src/

install: run ./xcaddy build "v$PACKAGE_VERSION" --output caddy && install_bins caddy
