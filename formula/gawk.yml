summary: GNU awk utility
src-url: https://ftp.gnu.org/gnu/gawk/gawk-5.4.2.tar.xz
src-sha: b95e4909533b5f988c6b5e5539b3b3ddf76e7d7df02ca2e5b5b7d6f62db78e6a
license: GPL-3.0-or-later
dep-pkg: libreadline libmpfr

install: |
    configure \
        --with-pic \
        --with-readline="$libreadline_INSTALL_DIR" \
        --with-mpfr="$libmpfr_INSTALL_DIR" \
        --enable-extensions \
        --enable-lint \
        --enable-mpfr \
        --disable-pma \
        --disable-builtin-intdiv0
