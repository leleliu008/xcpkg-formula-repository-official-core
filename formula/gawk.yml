summary: GNU awk utility
src-url: https://ftp.gnu.org/gnu/gawk/gawk-5.4.1.tar.xz
src-sha: 07f6f7342b7febe4313fc2c2542ad93d64fe20ad8717200109f105a826f5fd37
license: GPL-3.0-or-later
dep-pkg: libreadline libmpfr

install: |
    configure \
        --with-pic \
        --with-readline="$libreadline_INSTALL_DIR" \
        --with-mpfr="$libmpfr_INSTALL_DIR" \
        --enable-extensions \
        --enable-lint \
        --enable-mpfr \
        --disable-pma \
        --disable-builtin-intdiv0
