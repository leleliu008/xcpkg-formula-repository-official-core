summary: PDF rendering library (based on the xpdf-3.0 code base)
git-url: https://gitlab.freedesktop.org/poppler/poppler.git
src-url: https://poppler.freedesktop.org/poppler-26.11.0.tar.xz
src-sha: 41c32680160addf5a8dd7a830e4869c01e9f6bee1abb91e44fabd1ba9d7828fb
license: GPL-2.0-only
dep-pkg: libcairo libharfbuzz liblcms2 libtiff libjpeg-turbo libopenjpeg libcurl libgpgmepp libnss
dep-upp: gperf python3

install: |
    cmakew 2 \
        -DBUILD_GTK_TESTS=OFF \
        -DENABLE_BOOST=OFF \
        -DENABLE_CMS=lcms2 \
        -DENABLE_GLIB=ON \
        -DENABLE_QT5=OFF \
        -DENABLE_QT6=OFF \
        -DENABLE_UNSTABLE_API_ABI_HEADERS=ON \
        -DWITH_GObjectIntrospection=OFF

dotweak: gsed -i -e ':a' -e '/\\[[:space:]]*$/{N;s/\\[[:space:]]*\n[[:space:]]*/ /;ta}' -e 'P;D' lib/pkgconfig/poppler-glib.pc
