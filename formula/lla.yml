summary: A high-performance, extensible alternative to ls
src-url: https://github.com/chaqchase/lla/archive/refs/tags/v0.9.0.tar.gz
src-sha: 578bd6d4e89044988d140962c47a9618c74f101cb861802a9ab8cc2a708833d5
license: MIT
install: |
    cargow install --path lla

    for item in plugins/*
    do
        cargow build --locked --lib --manifest-path="$item/Cargo.toml"
        install_libs target/$RUST_TARGET/release/*.dylib
    done
