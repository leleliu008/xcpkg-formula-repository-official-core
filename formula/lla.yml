summary: A high-performance, extensible alternative to ls
src-url: https://github.com/chaqchase/lla/archive/refs/tags/v0.9.1.tar.gz
src-sha: 8cad0003c54e4f44e62bdabbc5c4a09e5d5d20d241871cf7d54102e9ac29ada8
license: MIT
install: |
    cargow install --path lla

    for item in plugins/*
    do
        cargow build --locked --lib --manifest-path="$item/Cargo.toml"
        install_libs target/$RUST_TARGET/release/*.dylib
    done
