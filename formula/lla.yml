summary: A high-performance, extensible alternative to ls
src-url: https://github.com/chaqchase/lla/archive/refs/tags/v0.9.2.tar.gz
src-sha: 866e8d177b4c6e15dc988c49f6b074ce9b4c68fb75e5d3a56486c12626363b1a
license: MIT
install: |
    cargow install --path lla

    for item in plugins/*
    do
        cargow build --locked --lib --manifest-path="$item/Cargo.toml"
        install_libs target/$RUST_TARGET/release/*.dylib
    done
