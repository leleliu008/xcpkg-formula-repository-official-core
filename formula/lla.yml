summary: A high-performance, extensible alternative to ls
src-url: https://github.com/chaqchase/lla/archive/refs/tags/v0.6.6.tar.gz
src-sha: cfbb50f6e72d34485491743da1277b7095e0781efcb0bf4a3cf0b3665818fd5e
license: MIT
install: |
    cargow install --path lla

    for item in plugins/*
    do
        cargow build --locked --lib --manifest-path="$item/Cargo.toml"
        install_libs target/$RUST_TARGET/release/*.dylib
    done
