summary: Zip file manipulation library with minizip 1.x compatibility layer
src-url: https://github.com/zlib-ng/minizip-ng/archive/refs/tags/4.2.2.tar.gz
src-sha: 71af7b9799856d8b03619df3949e9c1be9703f8de0795af71399ba283cb27aac
license: Zlib
dep-pkg: libzstd liblzma libbz2 libz

install: |
    cmakew \
        -DMZ_FETCH_LIBS=OFF \
        -DMZ_LIB_SUFFIX=-ng \
        -DMZ_LIBCOMP=OFF \
        -DMZ_ZLIB=ON \
        -DBUILD_SHARED_LIBS=OFF
    cmakew \
        -DMZ_FETCH_LIBS=OFF \
        -DMZ_LIB_SUFFIX=-ng \
        -DMZ_LIBCOMP=OFF \
        -DMZ_ZLIB=ON \
        -DBUILD_SHARED_LIBS=ON
