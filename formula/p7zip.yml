src-sha: c35640020e8f044b425d9c18e1808ff9206dc7caf77c9720f57eb0849d714cd1
license: LGPL-2.1-or-later
binbstd: 1
install: |
    run mv makefile.macosx_llvm_64bits makefile.machine
