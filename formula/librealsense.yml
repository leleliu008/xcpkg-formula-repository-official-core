summary: Intel RealSense D400 series and SR300 capture
src-url: https://github.com/realsenseai/librealsense/archive/refs/tags/v2.59.2.tar.gz
src-sha: a41a1533795c582ea12ba652ac6fe7cb97eed08fe9c91ba4fefed5bc044bc88c
license: Apache-2.0
dep-pkg: libusb libglfw3

install: |
    cmakew \
        -DCMAKE_CXX_STANDARD=17 \
        -DENABLE_CCACHE=OFF \
        -DBUILD_WITH_OPENMP=OFF \
        -DCHECK_FOR_UPDATES=OFF \
        -DENABLE_AI_ASSISTANT=OFF \
        -DENABLE_STATS=OFF
