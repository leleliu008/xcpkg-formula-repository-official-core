summary: A text shaping engine. It primarily supports OpenType, but also Apple Advanced Typography
src-url: https://github.com/harfbuzz/harfbuzz/releases/download/14.5.1/harfbuzz-14.5.1.tar.xz
src-sha: 7e2fa4e8c7c98e8d8140671f5772542afaaa6acccfbd746506886b6d85f7f8d6
dep-pkg: glib libicu libfreetype libgraphite2
license: MIT

dopatch: gsed -i "/subdir('util')/d" meson.build

install: |
    mesonw \
        -Dicu=enabled \
        -Dglib=enabled \
        -Dcairo=disabled \
        -Dcoretext=enabled \
        -Dfreetype=enabled \
        -Dgraphite=disabled \
        -Dgraphite2=enabled \
        -Dgobject=disabled \
        -Dintrospection=disabled \
        -Ddocs=disabled \
        -Dtests=disabled \
        -Dbenchmark=disabled

dotweak: gsed -i '/^Libs.private:/s|$| -framework CoreFoundation -framework CoreText -framework CoreGraphics|' lib/pkgconfig/harfbuzz.pc
