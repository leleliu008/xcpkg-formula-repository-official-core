summary: A text shaping engine. It primarily supports OpenType, but also Apple Advanced Typography
src-url: https://github.com/harfbuzz/harfbuzz/releases/download/15.2.0/harfbuzz-15.2.0.tar.xz
src-sha: e2ec49090744383cdbe7df808c1cedaafba06a97be8dc4211fe546ba585f12cb
dep-pkg: glib libicu libfreetype libgraphite2
license: MIT

dopatch: gsed -i "/subdir('util')/d" meson.build

install: |
    mesonw \
        -Dicu=enabled \
        -Dglib=enabled \
        -Dcairo=disabled \
        -Dcoretext=enabled \
        -Dfreetype=enabled \
        -Dgraphite=disabled \
        -Dgraphite2=enabled \
        -Dgobject=disabled \
        -Dintrospection=disabled \
        -Ddocs=disabled \
        -Dtests=disabled \
        -Dbenchmark=disabled

dotweak: gsed -i '/^Libs.private:/s|$| -framework CoreFoundation -framework CoreText -framework CoreGraphics|' lib/pkgconfig/harfbuzz.pc
