summary: Savoury implementation of the QUIC transport protocol and HTTP/3
src-url: https://github.com/cloudflare/quiche/archive/refs/tags/0.30.0.tar.gz
src-sha: 5ef0e72c2c4047d2bfe9a6ba2b5b5f1ff11d22d77b6c0be3e931c755c7b329dd
license: BSD-2-Clause
bsystem: cargo cmake

install: |
    cargow build --features ffi,pkg-config-meta
    install_incs quiche/include/quiche.h
    install_libs target/$RUST_TARGET/release/libquiche.a
    install_libs target/$RUST_TARGET/release/libquiche.dylib
    install_pcfs target/$RUST_TARGET/release/quiche.pc
