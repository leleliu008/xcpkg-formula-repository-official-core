summary: A command-line tool to update the MIME database
web-url: https://wiki.freedesktop.org/www/Software/shared-mime-info
git-url: https://gitlab.freedesktop.org/xdg/shared-mime-info
src-url: https://gitlab.freedesktop.org/xdg/shared-mime-info/-/archive/2.5.1/shared-mime-info-2.5.1.tar.bz2
src-sha: b75b420da9b0be9a3d99b1bee6ed87957b56ab54583ac1a97fbd0dc98ddddb25
license: GPL-2.0-only
dep-pkg: glib libxml2

dopatch: gsed -i "s|subdir('data')|install_man('data/update-mime-database.1')|" meson.build

install: mesonw -Dbuild-tools=true -Dbuild-tests=false -Dbuild-spec=false -Dbuild-translations=false -Dupdate-mimedb=false
