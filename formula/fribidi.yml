summary: A command-line interface to the libfribidi library and can be used to convert a logical string to visual output
src-url: https://github.com/fribidi/fribidi/releases/download/v1.0.17/fribidi-1.0.17.tar.xz
src-sha: 6949dcde27d41cebad1fd741fcafc36d55a1020d2d872d4a6eb3914caabbada2
license: LGPL-2.1-or-later
dep-upp: help2man
install: |
    configure only --enable-static --disable-shared
    gmakew -C lib
    gmakew -C bin
    install_bins bin/fribidi
