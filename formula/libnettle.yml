summary: Low-level cryptographic library
web-url: https://www.lysator.liu.se/~nisse/nettle
git-url: https://git.lysator.liu.se/nettle/nettle
src-url: https://ftp.gnu.org/gnu/nettle/nettle-4.0.tar.gz
src-sha: 3addbc00da01846b232fb3bc453538ea5468da43033f21bb345cb1e9073f5094
license: GPL-2.0-or-later
dep-pkg: libgmp
dep-upp: gm4

install: |
    configure \
        --with-include-path="$libgmp_INCLUDE_DIR" \
        --with-lib-path="$libgmp_LIBRARY_DIR" \
        --disable-fat \
        --disable-gcov \
        --disable-openssl \
        --disable-mini-gmp \
        --disable-assembler \
        --disable-documentation
