summary: A command-line tool to do a deep clean and optimize your macOS
src-url: https://github.com/tw93/Mole/archive/refs/tags/V1.70.0.tar.gz
src-sha: 38e100862d8648c9afbe0ce78d328c1934c2774ced63ea7e6d8ecc35de377d60
license: MIT

install: |
    gow -X main.Version=$PACKAGE_VERSION -X main.BuildTime=$TIMESTAMP_ISO8601 ./cmd/analyze
    gow -X main.Version=$PACKAGE_VERSION -X main.BuildTime=$TIMESTAMP_ISO8601 ./cmd/status
    install_bins mole
