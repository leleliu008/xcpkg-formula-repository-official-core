summary: A command-line tool to do a deep clean and optimize your macOS
src-url: https://github.com/tw93/Mole/archive/refs/tags/V1.58.0.tar.gz
src-sha: dc77d1e27497a9d423b56bd887da60fc8ecbaaafe49fe830a60af5434d205adf
